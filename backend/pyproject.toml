[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jericho-backend"
version = "0.1.0"
description = "Jericho 2.0 FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "instructor>=1.6",
    "ollama>=0.4",
    "supabase>=2.9",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.149",
    "caldav>=1.3",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "hypothesis>=6.115",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=jericho --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["jericho"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
